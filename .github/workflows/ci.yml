name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Node dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: npm run check:syntax

      - name: Verify module imports
        run: npm run check:imports

      - name: Run ESLint
        run: npm run lint

      - name: Install Python fonttools
        run: pip install "fonttools[brotli,woff]"

      - name: Verify icons
        run: python scripts/check-icons.py

      - name: Non-blocking npm audit
        run: npm audit --omit=dev || true

      - name: Integration health check
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          node server.js &
          SERVER_PID=$!
          sleep 3
          curl --fail http://localhost:5224/api/health || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ripcord:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

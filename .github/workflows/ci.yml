name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: |
          node --check server.js
          node --check public/app.js

      - name: Test vendor bundle compilation
        run: npm run build:vendor

      - name: Install FFmpeg & test server startup
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          node server.js &
          SERVER_PID=$!
          sleep 3
          curl --fail http://localhost:5224/api/health || (kill $SERVER_PID && exit 1)
          kill $SERVER_PID

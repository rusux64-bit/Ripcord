name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Node dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: npm run check:syntax

      - name: Verify module imports
        run: npm run check:imports

      - name: Run ESLint
        run: npm run lint

      - name: Install Python fonttools
        run: pip install -r scripts/requirements.txt

      - name: Verify icons
        run: npm run check:icons

      - name: Non-blocking npm audit
        run: npm audit --omit=dev || true

      - name: Integration health check
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          node server.js &
          SERVER_PID=$!
          trap 'kill -9 $SERVER_PID 2>/dev/null || true' EXIT
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://localhost:5224/api/health
          kill $SERVER_PID 2>/dev/null || true
          trap - EXIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ripcord:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

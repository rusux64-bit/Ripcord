services:
  ripcord:
    image: ghcr.io/rusux64-bit/ripcord:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ripcord
    restart: unless-stopped

    # Security Hardening
    # Run as unprivileged node user (UID 1000, GID 1000)
    user: "1000:1000"
    # Mount root filesystem as read-only
    read_only: true
    # Drop all Linux capabilities
    cap_drop:
      - ALL
    # Prevent privilege escalation
    security_opt:
      - no-new-privileges:true

    # Writable temporary filesystems mounted in RAM
    tmpfs:
      # Temporary audio downloads, conversions, and cookie isolation copies
      - /tmp:size=1G,uid=1000,gid=1000,mode=1777

    # Resource Constraints
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.25"
          memory: 256M

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-5224}:5224"

    environment:
      NODE_ENV: production
      PORT: ${PORT:-5224}
      XDG_CACHE_HOME: /tmp/.cache
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      DOWNLOAD_CONCURRENCY: ${DOWNLOAD_CONCURRENCY:-4}
      ENCODE_CONCURRENCY: ${ENCODE_CONCURRENCY:-2}
      SPOTIFY_SEARCH_CONCURRENCY: ${SPOTIFY_SEARCH_CONCURRENCY:-6}
      SPOTIFY_SEARCH_EARLY_EXIT_SCORE: ${SPOTIFY_SEARCH_EARLY_EXIT_SCORE:-0.9}
      SPOTIFY_PREWARM_MAX_TRACKS: ${SPOTIFY_PREWARM_MAX_TRACKS:-6}
      SPOTIFY_PREWARM_CONCURRENCY: ${SPOTIFY_PREWARM_CONCURRENCY:-2}
      METADATA_CONCURRENCY: ${METADATA_CONCURRENCY:-4}
      YTDLP_CONCURRENT_FRAGMENTS: ${YTDLP_CONCURRENT_FRAGMENTS:-4}
      SPOTIFY_MATCH_CACHE_MAX_SIZE: ${SPOTIFY_MATCH_CACHE_MAX_SIZE:-10000}
      SPOTIFY_MATCH_CACHE_TTL_DAYS: ${SPOTIFY_MATCH_CACHE_TTL_DAYS:-30}
      MAX_QUEUED_DOWNLOADS: ${MAX_QUEUED_DOWNLOADS:-8}
      MAX_PLAYLIST_TRACKS: ${MAX_PLAYLIST_TRACKS:-30}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      YTDLP_AUTHED_CLIENTS: ${YTDLP_AUTHED_CLIENTS:-web_embedded,web}
      # AGE_GATE_COOKIES: "off"
      # YTDLP_AGE_COOKIES_DIR: "/app/age_cookies"

    # Volume Mounts for Persistence & Cookies
    volumes:
      # Persistent Spotify-to-YouTube match cache across restarts:
      - cache:/app/cache
      # Dedicated throwaway age-gate cookie accounts directory (owner-only writable):
      # Set permissions on host: chown -R 1000:1000 ./age_cookies && chmod 700 ./age_cookies
      # Mounted :rw so the pool can write refreshed session tokens back to persist logins.
      # Trade-off: :ro prevents container modifications, but cookies cannot refresh and will expire prematurely.
      # - ./age_cookies:/app/age_cookies:rw
      # [Deprecated] Single fallback cookie file:
      # - ./cookies.txt:/app/cookies.txt:ro

volumes:
  cache:
